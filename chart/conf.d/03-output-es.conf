<label @OUTPUT>

  {{ if .Values.conf.debug -}}
  <match **.k8s.**>
      @type stdout
  </match>
  {{- else -}}
  
  {{- if .Values.conf.loki.enabled }}
  # Send logs to Loki
  <match **.k8s.**>
      @type loki
      
      url {{ .Values.conf.loki.url | required "loki.url is required when loki.enabled is true" }}
      {{- if or .Values.conf.loki.username .Values.conf.loki.password }}
      {{- if .Values.conf.loki.username }}
      username "#{ENV['LOKI_USERNAME']}"
      {{- end }}
      {{- if .Values.conf.loki.password }}
      password "#{ENV['LOKI_PASSWORD']}"
      {{- end }}
      {{- end }}
      {{- if .Values.conf.loki.tenantId }}
      tenant {{ .Values.conf.loki.tenantId | quote }}
      {{- end }}
      
      extra_labels {
        {{- range $key, $value := .Values.conf.loki.extraLabels }}
        "{{ $key }}": "{{ $value }}",
        {{- end }}
        "job": "fluentd"
      }
      
      # Use kubernetes metadata as labels
      <label_keys>
        container_name,namespace_name,pod_name
      </label_keys>
      
      {{ .Values.conf.loki.additionalOptions | nindent 6 }}
  </match>
  {{- else }}
  
  # Send logs to Elasticsearch
  <match **.k8s.**>
      @type elasticsearch

      host {{ .Values.conf.elasticsearch.host | required "host is required"  }}
      port {{ .Values.conf.elasticsearch.port | required "port is required" }}
      scheme {{ .Values.conf.elasticsearch.scheme | required "scheme is required" }}
      path {{ .Values.conf.elasticsearch.path | default "" | quote }}
      {{- if .Values.conf.elasticsearch.auth.enabled }}
      user "#{ENV['ELASTICSEARCH_USER']}"
      password "#{ENV['ELASTICSEARCH_PASSWORD']}"
      {{- end }}
      time_precision 6
      logstash_format true
      logstash_prefix {{ .Values.conf.elasticsearch.indexPrefix | required "indexPrefix is required" }}

      {{- if .Values.conf.elasticsearch.importIndexTemplate }}
      templates { "{{ .Values.conf.elasticsearch.indexPrefix }}": "/fluentd/etc/files/index-template.json"}
      use_legacy_template false
      template_overwrite true
      {{- end }}

      {{- if and (eq .Values.conf.elasticsearch.scheme "https") (.Values.conf.elasticsearch.auth.tlsSecret) }}
      ca_file /fluentd/etc/certs/ca.crt
      client_cert  /fluentd/etc/certs/tls.crt
      client_key  /fluentd/etc/certs/tls.key
      {{- end }}

      {{ .Values.conf.elasticsearch.additionalOptions  | nindent 6 }}

  </match>
  {{- end }}
  {{- end }}
</label>


# other events
<match **>
    @type stdout
</match>